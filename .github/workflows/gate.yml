name: Gate

# Reusable quality gate: typecheck, unit tests, integration tests. Shared by
# the push/PR CI workflow (ci.yml) and the tag-triggered release workflow
# (release.yml) so the runner setup is defined once, not copy-pasted twice.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve @vscode/test-electron version
        id: vscode-test-electron
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@vscode/test-electron'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache downloaded VSCode
        uses: actions/cache@v6
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ steps.vscode-test-electron.outputs.version }}

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Performance check (Operation count vs baseline)
        # Builds dist/ itself (pretest:performance) — this is the backstop
        # for a skipped or missing pre-commit hook (.githooks/pre-commit);
        # a regression here fails both ci.yml and release.yml, since both
        # call this reusable gate.
        run: npm run test:performance

      - name: Integration tests
        # @vscode/test-electron boots a real VSCode, which needs a display.
        run: xvfb-run --auto-servernum npm run test:integration
